<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    :root {
      --bg: oklch(97.50% 0.0062 255.47);
      --surface: oklch(100.00% 0.0000 89.88);
      --fg: oklch(25.21% 0.0458 260.46);
      --muted: oklch(50.22% 0.0383 256.82);
      --border: oklch(50.22% 0.0383 256.82);
      --accent: oklch(47.19% 0.2071 265.29);
      --focus: oklch(50.43% 0.1182 60.04);
      --border-soft: color-mix(in oklch, var(--border) 28%, var(--surface));
      --key-shadow: color-mix(in oklch, var(--border) 28%, transparent);
      --accent-hover: color-mix(in oklch, var(--accent) 82%, var(--fg));
      --surface-hover: color-mix(in oklch, var(--surface) 92%, var(--bg));
      --error-surface: color-mix(in oklch, var(--focus) 12%, var(--surface));
      --control-font: "Trebuchet MS", Tahoma, Arial, sans-serif;
      --body-font: Tahoma, Arial, sans-serif;
      --number-font: Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--body-font);
    }

    body {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
    }

    button {
      font: inherit;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 4vw, 36px);
    }

    .calculator-shell {
      width: min(720px, 100%);
      display: grid;
      grid-template-columns: minmax(250px, 0.86fr) minmax(330px, 1.14fr);
      gap: 18px;
      padding: clamp(14px, 2vw, 22px);
      border: 1px solid color-mix(in oklch, var(--border) 26%, var(--surface));
      border-radius: 12px;
      background: color-mix(in oklch, var(--surface) 76%, var(--bg));
      box-shadow: 0 18px 38px color-mix(in oklch, var(--border) 14%, transparent);
    }

    .display-panel {
      min-width: 0;
      display: grid;
      align-content: stretch;
      gap: 14px;
      padding: clamp(14px, 2vw, 18px);
      border: 1px solid color-mix(in oklch, var(--border) 22%, var(--surface));
      border-radius: 10px;
      background: var(--surface);
    }

    .calculator-title {
      margin: 0;
      font-family: var(--control-font);
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
      font-weight: 700;
    }

    .display-readout {
      min-width: 0;
      display: grid;
      gap: 8px;
      align-content: end;
      min-height: 198px;
      padding-top: 12px;
    }

    .expression {
      min-height: 28px;
      color: var(--muted);
      font-family: var(--number-font);
      font-size: 18px;
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
      text-align: left;
    }

    .result {
      min-width: 0;
      color: var(--fg);
      font-family: var(--number-font);
      font-size: clamp(40px, 5vw, 56px);
      line-height: 1.02;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-align: left;
    }

    .status {
      min-height: 48px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      font-family: var(--control-font);
      font-size: 16px;
      line-height: 1.35;
    }

    .status.has-error {
      border-color: color-mix(in oklch, var(--focus) 55%, var(--surface));
      background: var(--error-surface);
      color: var(--fg);
    }

    .keypad {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
    }

    .utility-row,
    .keypad-matrix {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .keypad-matrix {
      position: relative;
      isolation: isolate;
    }

    .keypad-matrix::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 0;
      right: 0;
      bottom: 0;
      width: calc((100% - 30px) / 4);
      border-radius: 8px;
      background: var(--accent);
      box-shadow: inset 0 1px 0 color-mix(in oklch, white 32%, transparent);
      pointer-events: none;
    }

    .key {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 64px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      background: var(--surface);
      color: var(--fg);
      box-shadow: 0 3px 0 var(--key-shadow);
      font-family: var(--control-font);
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 120ms ease, box-shadow 120ms ease, transform 120ms ease, border-color 120ms ease;
    }

    .key:hover {
      background: var(--surface-hover);
      border-color: color-mix(in oklch, var(--border) 44%, var(--surface));
    }

    .key:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--key-shadow);
    }

    .key:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-color: var(--focus);
    }

    .key.utility {
      grid-column: span 2;
      min-height: 52px;
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
    }

    .key.operator {
      border-color: color-mix(in oklch, white 20%, var(--accent));
      background: transparent;
      color: white;
      box-shadow: none;
    }

    .key.operator:hover {
      background: var(--accent-hover);
      border-color: white;
    }

    .key.operator.is-selected {
      background: var(--accent-hover);
    }

    .key.operator.is-selected::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 50%;
      width: 6px;
      height: 24px;
      border-radius: 999px;
      background: var(--surface);
      transform: translateY(-50%);
    }

    .key.operator.is-selected::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 3px;
      bottom: 9px;
      left: calc(50% - 9px);
      border-radius: 999px;
      background: white;
    }

    .key.equals {
      border-color: color-mix(in oklch, var(--accent) 54%, var(--surface));
      color: var(--accent);
    }

    .key.equals:hover {
      background: color-mix(in oklch, var(--accent) 10%, var(--surface));
    }

    @media (max-width: 720px) {
      .stage {
        align-items: start;
      }

      .calculator-shell {
        max-width: 430px;
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 12px;
        border-radius: 10px;
      }

      .display-panel {
        gap: 10px;
        padding: 14px;
      }

      .display-readout {
        min-height: 142px;
        padding-top: 4px;
      }

      .result {
        font-size: 40px;
      }

      .status {
        min-height: 44px;
      }

      .keypad,
      .utility-row,
      .keypad-matrix {
        gap: 8px;
      }

      .keypad-matrix::before {
        width: calc((100% - 24px) / 4);
        border-radius: 7px;
      }

      .key {
        min-height: 58px;
        border-radius: 7px;
        font-size: 20px;
      }

      .key.utility {
        min-height: 50px;
        font-size: 18px;
      }
    }

    @media (max-width: 340px) {
      .stage {
        padding: 8px;
      }

      .calculator-shell {
        padding: 10px;
      }

      .display-panel {
        padding: 12px;
      }

      .keypad,
      .utility-row,
      .keypad-matrix {
        gap: 7px;
      }

      .keypad-matrix::before {
        width: calc((100% - 21px) / 4);
      }

      .key {
        min-height: 54px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        transition-delay: 0ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" data-od-id="calculator-preview">
    <section class="calculator-shell" data-od-id="calculator-surface" data-state="initial" aria-labelledby="calculatorTitle">
      <div class="display-panel" data-od-id="display-panel">
        <h1 class="calculator-title" id="calculatorTitle" data-od-id="calculator-title">Calculator</h1>
        <div class="display-readout" data-od-id="readout-region">
          <div class="expression" id="expressionOutput" data-od-id="expression-output" aria-label="Expression"></div>
          <output class="result" id="resultOutput" data-od-id="result-output" role="status" aria-live="polite" aria-atomic="true">0</output>
        </div>
        <div class="status" id="statusOutput" data-od-id="status-region" aria-live="polite" aria-atomic="true"></div>
      </div>

      <div class="keypad" data-od-id="keypad-region">
        <div class="utility-row" data-od-id="utility-row">
          <button class="key utility" type="button" data-action="clear" aria-keyshortcuts="Escape" data-od-id="button-clear">Clear</button>
          <button class="key utility" type="button" data-action="backspace" aria-keyshortcuts="Backspace" data-od-id="button-backspace">Backspace</button>
        </div>
        <div class="keypad-matrix" data-od-id="keypad-matrix">
          <button class="key digit" type="button" data-value="7" data-od-id="button-7">7</button>
          <button class="key digit" type="button" data-value="8" data-od-id="button-8">8</button>
          <button class="key digit" type="button" data-value="9" data-od-id="button-9">9</button>
          <button class="key operator" type="button" data-operator="/" aria-label="Divide" aria-keyshortcuts="/" aria-pressed="false" data-od-id="button-divide">÷</button>
          <button class="key digit" type="button" data-value="4" data-od-id="button-4">4</button>
          <button class="key digit" type="button" data-value="5" data-od-id="button-5">5</button>
          <button class="key digit" type="button" data-value="6" data-od-id="button-6">6</button>
          <button class="key operator" type="button" data-operator="*" aria-label="Multiply" aria-keyshortcuts="*" aria-pressed="false" data-od-id="button-multiply">×</button>
          <button class="key digit" type="button" data-value="1" data-od-id="button-1">1</button>
          <button class="key digit" type="button" data-value="2" data-od-id="button-2">2</button>
          <button class="key digit" type="button" data-value="3" data-od-id="button-3">3</button>
          <button class="key operator" type="button" data-operator="-" aria-label="Subtract" aria-keyshortcuts="-" aria-pressed="false" data-od-id="button-subtract">−</button>
          <button class="key digit" type="button" data-value="0" data-od-id="button-0">0</button>
          <button class="key decimal" type="button" data-action="decimal" data-od-id="button-decimal">.</button>
          <button class="key equals" type="button" data-action="equals" aria-label="Equals" aria-keyshortcuts="Enter =" data-od-id="button-equals">=</button>
          <button class="key operator" type="button" data-operator="+" aria-label="Add" aria-keyshortcuts="+" aria-pressed="false" data-od-id="button-add">+</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const expressionOutput = document.getElementById("expressionOutput");
      const resultOutput = document.getElementById("resultOutput");
      const statusOutput = document.getElementById("statusOutput");
      const shell = document.querySelector("[data-od-id='calculator-surface']");
      const operatorButtons = Array.from(document.querySelectorAll("[data-operator]"));
      const symbols = { "/": "÷", "*": "×", "-": "−", "+": "+" };
      let displayValue = "0";
      let storedValue = null;
      let pendingOperator = null;
      let waitingForOperand = false;
      let justComputed = false;
      let error = false;

      function formatNumber(value) {
        if (!Number.isFinite(value)) return "0";
        const rounded = Math.abs(value) >= 1e12 || (Math.abs(value) > 0 && Math.abs(value) < 1e-7)
          ? value.toExponential(8)
          : Number.parseFloat(value.toFixed(12)).toString();
        return rounded.replace("+", "");
      }

      function compute(left, operator, right) {
        if (operator === "/" && right === 0) return null;
        if (operator === "/") return left / right;
        if (operator === "*") return left * right;
        if (operator === "-") return left - right;
        return left + right;
      }

      function setError() {
        error = true;
        displayValue = "0";
        storedValue = null;
        pendingOperator = null;
        waitingForOperand = false;
        justComputed = false;
        shell.dataset.state = "divide-by-zero";
        expressionOutput.textContent = "";
        resultOutput.textContent = "0";
        statusOutput.textContent = "Cannot divide by zero. Clear to start again.";
        statusOutput.classList.add("has-error");
        shell.classList.add("has-error");
        setSelectedOperator(null);
      }

      function clearAll() {
        displayValue = "0";
        storedValue = null;
        pendingOperator = null;
        waitingForOperand = false;
        justComputed = false;
        error = false;
        shell.dataset.state = "initial";
        expressionOutput.textContent = "";
        statusOutput.textContent = "";
        statusOutput.classList.remove("has-error");
        shell.classList.remove("has-error");
        setSelectedOperator(null);
        render();
      }

      function setSelectedOperator(operator) {
        operatorButtons.forEach((button) => {
          const active = button.dataset.operator === operator;
          button.classList.toggle("is-selected", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }

      function render() {
        resultOutput.textContent = displayValue;
      }

      function inputDigit(digit) {
        if (error) return;
        if (justComputed) {
          displayValue = digit;
          expressionOutput.textContent = "";
          justComputed = false;
          shell.dataset.state = "entry";
          render();
          return;
        }
        if (waitingForOperand) {
          displayValue = digit;
          waitingForOperand = false;
          shell.dataset.state = "entry";
          render();
          return;
        }
        displayValue = displayValue === "0" ? digit : displayValue + digit;
        shell.dataset.state = "entry";
        render();
      }

      function inputDecimal() {
        if (error) return;
        if (justComputed) {
          displayValue = "0.";
          expressionOutput.textContent = "";
          justComputed = false;
          shell.dataset.state = "entry";
          render();
          return;
        }
        if (waitingForOperand) {
          displayValue = "0.";
          waitingForOperand = false;
          shell.dataset.state = "entry";
          render();
          return;
        }
        if (!displayValue.includes(".")) {
          displayValue += ".";
          shell.dataset.state = "entry";
          render();
        }
      }

      function chooseOperator(operator) {
        if (error) return;
        const inputValue = Number(displayValue);
        if (pendingOperator && !waitingForOperand) {
          const result = compute(storedValue, pendingOperator, inputValue);
          if (result === null) {
            setError();
            return;
          }
          storedValue = result;
          displayValue = formatNumber(result);
        } else {
          storedValue = inputValue;
        }
        pendingOperator = operator;
        waitingForOperand = true;
        justComputed = false;
        expressionOutput.textContent = `${formatNumber(storedValue)} ${symbols[operator]}`;
        statusOutput.textContent = "";
        statusOutput.classList.remove("has-error");
        shell.dataset.state = "operator-selected";
        setSelectedOperator(operator);
        render();
      }

      function completeCalculation() {
        if (error || pendingOperator === null || storedValue === null || waitingForOperand) return;
        const rightValue = Number(displayValue);
        const result = compute(storedValue, pendingOperator, rightValue);
        if (result === null) {
          setError();
          return;
        }
        expressionOutput.textContent = `${formatNumber(storedValue)} ${symbols[pendingOperator]} ${displayValue} =`;
        displayValue = formatNumber(result);
        storedValue = null;
        pendingOperator = null;
        waitingForOperand = false;
        justComputed = true;
        statusOutput.textContent = "";
        shell.dataset.state = "computed";
        setSelectedOperator(null);
        render();
      }

      function backspace() {
        if (error || waitingForOperand) return;
        if (justComputed) {
          clearAll();
          return;
        }
        displayValue = displayValue.length > 1 ? displayValue.slice(0, -1) : "0";
        shell.dataset.state = displayValue === "0" ? "initial" : "entry";
        render();
      }

      document.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.value) inputDigit(button.dataset.value);
        if (button.dataset.operator) chooseOperator(button.dataset.operator);
        if (button.dataset.action === "decimal") inputDecimal();
        if (button.dataset.action === "equals") completeCalculation();
        if (button.dataset.action === "backspace") backspace();
        if (button.dataset.action === "clear") clearAll();
      });

      document.addEventListener("keydown", (event) => {
        const key = event.key;
        if (key === "Enter" && event.target instanceof HTMLButtonElement) return;
        if (/^[0-9]$/.test(key)) {
          inputDigit(key);
          event.preventDefault();
        } else if (key === ".") {
          inputDecimal();
          event.preventDefault();
        } else if (key === "+" || key === "-" || key === "*" || key === "/") {
          chooseOperator(key);
          event.preventDefault();
        } else if (key === "Enter" || key === "=") {
          completeCalculation();
          event.preventDefault();
        } else if (key === "Backspace") {
          backspace();
          event.preventDefault();
        } else if (key === "Escape") {
          clearAll();
          event.preventDefault();
        }
      });

      clearAll();
    })();
  </script>
</body>
</html>
