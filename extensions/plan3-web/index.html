<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
 <title>Plan3 architecture workspace</title>
 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='rotate(40 16 16)'%3E%3Crect x='14.5' y='3' width='3' height='16' rx='1.5' fill='%23c4893f'/%3E%3Crect x='10.5' y='1.5' width='11' height='3.5' rx='1.75' fill='%23c4893f'/%3E%3Cpath d='M9.5 18.5h13v5.5a6.5 6.5 0 0 1-13 0z' fill='%23495057'/%3E%3C/g%3E%3C/svg%3E">
 <link rel="stylesheet" href="/a/__BUILD__/styles.css?token=__TOKEN__">
 <script type="module" src="/a/__BUILD__/app.js?token=__TOKEN__"></script>
</head>
<body>
 <nav id="switcher" class="switcher" aria-label="Shared sessions" data-open="false" hidden>
  <button id="switcher-toggle" type="button" aria-expanded="false" aria-controls="session-list" aria-label="Show shared sessions">☰</button>
  <div id="session-list" class="session-list"></div>
 </nav>
 <header class="topbar">
  <button id="drawer-toggle" class="drawer-toggle" type="button" aria-controls="drawer" aria-expanded="false" aria-label="Open menu">☰</button>
  <div class="workspace-title"><h1><button id="title" class="title-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="title-menu">Architecture workspace</button></h1></div>
  <!-- Line 1: model and effort, context, Plan3 bias. Line 2: progress bars (plan, subscription usage). Desktop: one line in the top bar. -->
  <section class="status-line" aria-label="Session status">
   <div class="status-row">
    <button id="model-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="model-menu" title="Change model and thinking level">Model</button>
    <button id="context-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="context-menu" title="Context use; compact">Context</button>
    <button id="bias-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="bias-menu" title="Plan3 bias: thinking or coding model (Alt+= / Alt+-)">💡 Normal</button>
   </div>
   <div class="status-row status-bars">
    <button id="plan-button" class="bar" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="plan-menu">New plan</button>
    <button id="usage-button" class="bar-group" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="usage-menu" title="Subscription usage" hidden></button>
   </div>
   <div id="model-menu" class="status-menu" role="group" aria-label="Model and thinking level" hidden></div>
   <div id="context-menu" class="status-menu" role="group" aria-label="Context" hidden><button type="button" id="compact-now">Compact now</button></div>
   <div id="bias-menu" class="status-menu" role="group" aria-label="Plan3 bias" hidden></div>
   <div id="usage-menu" class="status-menu usage-menu" role="group" aria-label="Subscription usage" hidden></div>
   <div id="plan-menu" class="status-menu" role="group" aria-label="Plans and plan actions" hidden>
    <div id="plan-list" class="plan-list"></div><hr id="plan-divider" hidden>
    <button type="button" data-command="resolve" data-plan>Resolve questions</button>
    <button type="button" data-command="ideas" data-plan>Ideas</button>
    <button type="button" data-command="review" data-plan>Review</button>
    <button type="button" data-command="finish" data-plan>Finish planning</button>
    <button type="button" data-command="resume" data-plan>Start or continue work</button>
    <button type="button" data-command="new">New plan</button>
   </div>
  </section>
 </header>
 <div id="title-menu" class="status-menu title-menu" role="group" aria-label="Shared sessions" hidden></div>
 <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
 <aside id="drawer" class="drawer" aria-label="Menu" data-open="false" inert>
  <h2>View</h2><div id="drawer-views"></div>
  <h2>Session</h2><div id="drawer-status"></div>
  <div class="drawer-commands"><button id="pi-commands" type="button" aria-haspopup="dialog">Pi commands</button><button id="wo-commands" type="button" aria-haspopup="dialog">/wo commands</button></div>
 </aside>
 <nav id="mobile-tabs" class="mobile-tabs" role="tablist" aria-label="Views">
  <button id="mobile-chat" type="button" role="tab" aria-controls="chat" aria-selected="true">Chat</button>
  <button id="mobile-files" type="button" role="tab" aria-controls="files" aria-selected="false" tabindex="-1">Files</button>
  <button id="mobile-diagram" type="button" role="tab" aria-controls="canvas" aria-selected="false" tabindex="-1">Diagram</button>
 </nav>
 <main id="workspace" class="workspace" data-left="full" data-mobile="chat">
  <button id="expand-left" class="expand-left" type="button" aria-label="Show files and diagram" aria-controls="left-panel" aria-expanded="false" hidden>&gt;&gt;</button>
  <section id="left-panel" class="left-panel" aria-label="Project">
  <div class="left-tabs">
   <div role="tablist" aria-label="Project views">
    <button id="tab-files" type="button" role="tab" aria-selected="false" aria-controls="files" tabindex="-1">Files</button>
    <button id="tab-diagram" type="button" role="tab" aria-selected="true" aria-controls="canvas">Diagram</button>
   </div>
   <div id="zoom-controls" class="zoom-controls" aria-label="Diagram zoom">
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <output id="zoom-level" aria-label="Zoom level">100%</output>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="zoom-fit" type="button">Fit</button>
    <button id="pin-note" type="button" aria-pressed="false">Add note</button>
   </div>
   <button id="narrow-left" type="button" aria-pressed="false" title="Narrow this panel to the chat's width">Narrow</button>
   <button id="collapse-left" type="button" aria-label="Collapse files and diagram" aria-controls="left-panel" aria-expanded="true">&lt;&lt;</button>
  </div>
  <section id="files" class="files" role="tabpanel" aria-labelledby="tab-files" hidden></section>
  <section id="canvas" class="canvas" role="tabpanel" aria-labelledby="tab-diagram" aria-label="Diagram workspace">
   <svg id="diagram" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Architecture diagram" tabindex="0"></svg>
   <p id="empty-diagram" class="empty-diagram">No diagram yet. Ask in the chat, for example: draw the main components.</p>
   <div class="search-box"><input id="search" type="search" placeholder="Search (Ctrl+F)" aria-label="Search the diagram; Enter jumps to the next match"><output id="search-count" aria-live="polite"></output></div>
   <div id="hover-card" class="hover-card" role="tooltip" tabindex="0" hidden></div>
  </section>
  </section>
  <div id="splitter" class="splitter" role="separator" tabindex="0" aria-label="Resize chat pane" aria-orientation="vertical" aria-controls="chat" aria-valuemin="280" aria-valuemax="640" aria-valuenow="380"></div>
  <aside id="chat" class="chat" aria-label="Live Pi session">
   <header class="chat-heading"><h2>Live session</h2><span class="modes"><button id="mode-research" class="mode-chip" type="button" aria-pressed="false" title="Research mode: explore, don't implement (/research)">Research</button><button id="mode-night" class="mode-chip" type="button" aria-pressed="false" title="Night mode: work unattended until the plan is done (/night)">Night</button></span><span id="connection" role="status">Connecting…</span></header>
   <div class="notices"><p id="notice" class="notice" role="status" hidden></p><p id="waiting" class="notice" role="status" hidden></p></div>
   <div id="feed" class="feed">
    <ol id="messages" class="messages" role="log" aria-label="Conversation" aria-live="polite"></ol>
    <section id="activity" class="activity" aria-label="Agent activity"></section>
   </div>
   <button id="to-bottom" class="to-bottom" type="button" aria-label="Scroll to the newest message" hidden>↓ New messages</button>
   <form id="composer" class="composer">
    <div id="mentions" class="mentions" aria-label="Mentioned elements"></div>
    <div id="slash-menu" class="slash-menu" role="listbox" aria-label="Commands" hidden></div>
    <textarea id="message-input" rows="4" maxlength="20000" placeholder="Ask about the architecture…" aria-label="Message to Pi" aria-describedby="input-help"></textarea>
    <div class="composer-actions">
     <span id="input-help" class="input-help">Ctrl+click a box to mention it</span>
     <label class="attach button" title="Attach an image">Image<input id="attach" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></label>
     <button id="stop" type="button" class="danger" hidden>Stop</button>
     <button id="send" type="submit" disabled>Send</button>
    </div>
   </form>
  </aside>
 </main>
 <dialog id="comment-prompt" aria-labelledby="comment-title">
  <form id="comment-form">
   <h2 id="comment-title">Add a note</h2>
   <p id="comment-purpose" class="dialog-purpose">Pin a comment to the displayed architecture.</p>
   <label for="comment-text">Note</label><textarea id="comment-text" required maxlength="8000" rows="5"></textarea>
   <p id="comment-error" role="alert" hidden></p>
   <div class="dialog-actions"><button id="comment-cancel" type="button">Cancel</button><button id="comment-save" type="submit">Save note</button></div>
  </form>
 </dialog>
 <dialog id="command-picker" aria-labelledby="command-title"><h2 id="command-title">Commands</h2><p class="dialog-purpose">Pick one to put it in the message box.</p><div id="command-list" class="command-list"></div><div class="dialog-actions"><button id="command-close" type="button">Close</button></div></dialog>
 <dialog id="prompt" aria-labelledby="prompt-title"><form id="prompt-form"></form></dialog>
</body>
</html>
