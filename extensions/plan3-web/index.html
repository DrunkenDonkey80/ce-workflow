<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
 <title>Plan3 architecture workspace</title>
 <link rel="stylesheet" href="/a/__BUILD__/styles.css?token=__TOKEN__">
 <script type="module" src="/a/__BUILD__/app.js?token=__TOKEN__"></script>
</head>
<body>
 <header class="topbar">
  <div class="workspace-title"><h1 id="title">Architecture workspace</h1><span id="target-kind" class="badge">Plan</span></div>
 </header>
 <p id="notice" class="notice" role="status" hidden></p>
 <p id="waiting" class="notice" role="status" hidden></p>
 <nav id="mobile-tabs" class="mobile-tabs" role="tablist" aria-label="Views">
  <button id="mobile-chat" type="button" role="tab" aria-controls="chat" aria-selected="true">Chat</button>
  <button id="mobile-files" type="button" role="tab" aria-controls="files" aria-selected="false" tabindex="-1">Files</button>
  <button id="mobile-diagram" type="button" role="tab" aria-controls="canvas" aria-selected="false" tabindex="-1">Diagram</button>
 </nav>
 <main id="workspace" class="workspace" data-left="full" data-mobile="chat">
  <button id="expand-left" class="expand-left" type="button" aria-label="Show files and diagram" aria-controls="left-panel" aria-expanded="false" hidden>&gt;&gt;</button>
  <section id="left-panel" class="left-panel" aria-label="Project">
  <div class="left-tabs">
   <div role="tablist" aria-label="Project views">
    <button id="tab-files" type="button" role="tab" aria-selected="false" aria-controls="files" tabindex="-1">Files</button>
    <button id="tab-diagram" type="button" role="tab" aria-selected="true" aria-controls="canvas">Diagram</button>
   </div>
   <button id="narrow-left" type="button" aria-pressed="false" title="Narrow this panel to the chat's width">Narrow</button>
   <button id="collapse-left" type="button" aria-label="Collapse files and diagram" aria-controls="left-panel" aria-expanded="true">&lt;&lt;</button>
  </div>
  <section id="files" class="files" role="tabpanel" aria-labelledby="tab-files" hidden></section>
  <section id="canvas" class="canvas" role="tabpanel" aria-labelledby="tab-diagram" aria-label="Diagram workspace">
   <svg id="diagram" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Architecture diagram" tabindex="0"></svg>
   <p id="empty-diagram" class="empty-diagram">No diagram yet. Ask in the chat, for example: draw the main components.</p>
   <div class="search-box"><input id="search" type="search" placeholder="Search (Ctrl+F)" aria-label="Search the diagram; Enter jumps to the next match"><output id="search-count" aria-live="polite"></output></div>
   <div id="zoom-controls" class="zoom-controls" aria-label="Diagram zoom">
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <output id="zoom-level" aria-label="Zoom level">100%</output>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="zoom-fit" type="button">Fit</button>
    <button id="pin-note" type="button" aria-pressed="false">Add note</button>
   </div>
   <div id="hover-card" class="hover-card" role="tooltip" tabindex="0" hidden></div>
  </section>
  </section>
  <div id="splitter" class="splitter" role="separator" tabindex="0" aria-label="Resize chat pane" aria-orientation="vertical" aria-controls="chat" aria-valuemin="280" aria-valuemax="640" aria-valuenow="380"></div>
  <aside id="chat" class="chat" aria-label="Live Pi session">
   <header class="chat-heading"><h2>Live session</h2><span id="connection" role="status">Connecting…</span></header>
   <section class="status-line" aria-label="Session status">
    <div class="status-row">
     <button id="model-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="model-menu" title="Change model and effort">Model</button>
     <button id="status-more" type="button" aria-expanded="false" aria-controls="status-extra" aria-label="More status">⋯</button>
    </div>
    <button id="plan-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="plan-menu">New plan</button>
    <p id="status-extra" class="status-extra" hidden><span class="shared">[SHARED]</span> <span id="context-use"></span></p>
    <div id="model-menu" class="status-menu" role="group" aria-label="Model and effort" hidden></div>
    <div id="plan-menu" class="status-menu" role="group" aria-label="Plan actions" hidden>
     <button type="button" data-command="resolve" data-plan>Resolve questions</button>
     <button type="button" data-command="ideas" data-plan>Ideas</button>
     <button type="button" data-command="review" data-plan>Review</button>
     <button type="button" data-command="finish" data-plan>Finish planning</button>
     <button type="button" data-command="resume" data-plan>Start or continue work</button>
     <button type="button" data-command="switch">Switch plan</button>
     <button type="button" data-command="new">New plan</button>
    </div>
   </section>
   <section id="activity" class="activity" aria-label="Agent activity"></section>
   <button id="earlier" class="earlier" type="button" hidden>Show earlier</button>
   <ol id="messages" class="messages" role="log" aria-label="Conversation" aria-live="polite"></ol>
   <button id="to-bottom" class="to-bottom" type="button" aria-label="Scroll to the newest message" hidden>↓ New messages</button>
   <form id="composer" class="composer">
    <div id="mentions" class="mentions" aria-label="Mentioned elements"></div>
    <textarea id="message-input" rows="2" maxlength="20000" placeholder="Ask about the architecture…" aria-label="Message to Pi" aria-describedby="input-help"></textarea>
    <div class="composer-actions">
     <span id="input-help" class="input-help">Ctrl+click a box to mention it</span>
     <label class="attach button" title="Attach an image">Image<input id="attach" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></label>
     <button id="stop" type="button" class="danger" hidden>Stop</button>
     <button id="send" type="submit" disabled>Send</button>
    </div>
   </form>
  </aside>
 </main>
 <dialog id="comment-prompt" aria-labelledby="comment-title">
  <form id="comment-form">
   <h2 id="comment-title">Add a note</h2>
   <p id="comment-purpose" class="dialog-purpose">Pin a comment to the displayed architecture.</p>
   <label for="comment-text">Note</label><textarea id="comment-text" required maxlength="8000" rows="5"></textarea>
   <p id="comment-error" role="alert" hidden></p>
   <div class="dialog-actions"><button id="comment-cancel" type="button">Cancel</button><button id="comment-save" type="submit">Save note</button></div>
  </form>
 </dialog>
 <dialog id="prompt" aria-labelledby="prompt-title"><form id="prompt-form"></form></dialog>
</body>
</html>
