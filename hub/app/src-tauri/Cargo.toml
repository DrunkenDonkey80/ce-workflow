[package]
name = "pi-hub-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
