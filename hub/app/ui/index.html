<!doctype html>
<html><head><meta charset="utf-8"><title>Pi Hub tabs</title>
<style>
 body { margin: 0; font: 13px system-ui, sans-serif; background: #f1f3f5; display: flex; height: 36px; align-items: stretch; overflow: hidden; user-select: none }
 button { border: 0; background: none; padding: 0 14px; font: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px; max-width: 280px; white-space: nowrap; overflow: hidden }
 button.on { background: #fff; box-shadow: inset 0 -2px #4dabf7 }
 i { width: 9px; height: 9px; border-radius: 50%; background: #adb5bd; flex: none }
 i.waiting { background: #e03131 } i.working { background: #f59f00 } i.unseen { background: #1c7ed6 }
</style></head>
<body>
<script>
// A-02 spike strip: tabs from the hub list, state from each page's title, icons drawn here and handed to Rust.
const { invoke } = window.__TAURI__.core;
const COLORS = { waiting: "#e03131", working: "#f59f00", unseen: "#1c7ed6", idle: "#adb5bd" };
let tabs = [], active = 0, iconKey = "";
const stateOf = title => title.startsWith("(!)") ? "waiting" : "idle"; // spike: today's page title only marks questions
function render() {
 document.body.replaceChildren(...tabs.map((tab, i) => {
  const button = document.createElement("button"), dot = document.createElement("i");
  dot.className = tab.state; button.className = i === active ? "on" : "";
  button.append(dot, `${i + 1} · ${tab.title}`); button.onclick = () => invoke("select", { index: i });
  return button;
 }));
 const key = tabs.map(t => t.state).join();
 if (key !== iconKey) { iconKey = key; void drawIcons(); }
}
function pixels(size, draw) { const c = new OffscreenCanvas(size, size), g = c.getContext("2d"); draw(g, size); return Array.from(g.getImageData(0, 0, size, size).data); }
function grid(g, size) { // 2x2: one square per hub in its state colour
 tabs.slice(0, 4).forEach((tab, i) => { const h = size / 2; g.fillStyle = COLORS[tab.state]; g.fillRect((i % 2) * h + 1, Math.floor(i / 2) * h + 1, h - 2, h - 2); });
}
async function drawIcons() {
 const waiting = tabs.some(t => t.state === "waiting");
 const overlay = waiting ? pixels(16, g => { g.fillStyle = COLORS.waiting; g.beginPath(); g.arc(8, 8, 7, 0, 7); g.fill(); }) : null;
 try { await invoke("set_icons", { big: pixels(32, grid), bigSize: 32, small: pixels(16, grid), smallSize: 16, overlay }); } catch (e) { console.error(e); }
}
window.onTitle = (label, title) => { const i = Number(label.slice(3)); tabs[i] = { title: title || tabs[i]?.title || "hub", state: stateOf(title) }; render(); };
window.selected = i => { active = i; render(); };
const host = url => { try { return new URL(url).host; } catch { return url; } };
invoke("hubs").then(urls => { tabs = urls.map(u => ({ title: host(u), state: "idle" })); render(); });
</script>
</body></html>
