<!doctype html>
<html><head><meta charset="utf-8"><title>Pi Hub tabs</title>
<style>
 :root { color-scheme: light dark; --bar: #f1f3f5; --on: #fff; --ink: #212529; --muted: #6c757d; --sel: #4dabf7 }
 @media (prefers-color-scheme: dark) { :root { --bar: #1f2328; --on: #2d333b; --ink: #e9ecef; --muted: #adb5bd } }
 body { margin: 0; font: 13px system-ui, "Segoe UI", sans-serif; background: var(--bar); color: var(--ink); display: flex; height: 36px; align-items: stretch; overflow: hidden; user-select: none }
 button { border: 0; background: none; color: inherit; padding: 0 12px; font: inherit; cursor: pointer; display: flex; align-items: center; gap: 7px; max-width: 240px; white-space: nowrap; overflow: hidden }
 button.tab.on { background: var(--on); box-shadow: inset 0 -2px var(--sel) }
 button.tab.hidden { opacity: .6; font-style: italic }
 button.tab.drop { box-shadow: inset 2px 0 var(--sel) }
 button.tab img { width: 20px; height: 20px; flex: none }
 button.tab span { overflow: hidden; text-overflow: ellipsis }
 button.tab small { color: var(--muted) }
 button.tab small.behind { color: #d97706; font-weight: 700 }
 #add { padding: 0 12px; font-size: 18px; color: var(--muted) }
 #ask { flex: 1; margin: 5px 8px; padding: 0 8px; border: 1px solid var(--sel); border-radius: 4px; background: var(--on); color: inherit; font: inherit; outline: none }
 #note.update { cursor: pointer; color: var(--ink); text-decoration: underline }
 #note { flex: 1; text-align: right; align-self: center; padding: 0 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
 /* The frameless window's buttons (Windows): gear for the shown hub's settings, then minimize, maximize, close. */
 button.win { width: 46px; padding: 0; justify-content: center; font-size: 15px; flex: none; position: relative }
 button.win:hover { background: color-mix(in srgb, var(--ink) 12%, transparent) }
 button.win.close:hover { background: #e81123; color: #fff }
 button.win.gear { font-size: 19px; width: 40px }
 button.win b { position: absolute; right: 6px; bottom: 6px; min-width: 9px; height: 9px; border-radius: 5px; background: #e03131; font: 600 9px/9px system-ui; color: #fff; padding: 0 }
 button.win b.count { background: #f59f00; padding: 0 3px; min-width: 7px; height: 12px; line-height: 12px; color: #000 }
</style></head>
<body data-tauri-drag-region="deep">
<script type="module">
// The strip is the app's brain: tab list, each hub's state from its page title (D5), icons drawn with the hub's own icons.ts (D8).
import { ICONS, iconSvg, hubsIconSvg } from "./icons.js";
const { invoke } = window.__TAURI__.core;
const DEFAULT_ICON = Object.keys(ICONS)[0];
const URGENCY = ["waiting", "working", "unseen", "scheduled"], DOT = { waiting: "#e03131", working: "#f59f00", unseen: "#37b24d", scheduled: "#339af0" };
let pinned = false;
const WORD = { waiting: "asking", working: "working", unseen: "finished", scheduled: "timer" };
let tabs = [], active = 0, nextId = 0, dark = null, iconKey = "", dragged = null, startupError = "";

const host = url => { try { return new URL(url).hostname; } catch { return url; } };
const label = tab => tab.name ?? (tab.hubName || (tab.local ? "This PC" : host(tab.url)));
const fullName = tab => tab.name || tab.hubName || (tab.local ? "This PC" : host(tab.url));
const stateWord = tab => tab.url ? (WORD[URGENCY.find(s => tab.states.includes(s))] ?? "idle") : "starting…";
// D14: on a dark taskbar the dark ink vanishes, so swap it for the light one (and drop the page-scheme rule).
const ink = svg => dark === null ? svg : svg.replace(/<style>.*?<\/style>/, "").replaceAll("#343a40", dark ? "#e9ecef" : "#343a40");
const dataUrl = svg => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);

function persist() { void invoke("save", { hubs: tabs.map(tab => tab.local ? { local: true, name: tab.name, hidden: tab.hidden } : { url: tab.url, name: tab.name, hidden: tab.hidden }) }); }
// A hub behind the newest version any tab runs is marked, so an out-of-date PC shows.
const parts = v => v.split(".").map(Number), older = (a, b) => { const x = parts(a), y = parts(b); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0); return false; };
function render() {
 if (asking) return void updateIcons(); // keep the open question; icons still follow the hubs
 const newest = tabs.map(tab => tab.version).filter(Boolean).reduce((a, b) => older(a, b) ? b : a, "");
 const buttons = tabs.flatMap((tab, i) => {
  if (tab.hidden && !revealed && i !== active) return [];
  const button = document.createElement("button"), img = document.createElement("img"), text = document.createElement("span");
  img.src = dataUrl(iconSvg(ICONS[tab.icon] ? tab.icon : DEFAULT_ICON, tab.states)); img.alt = "";
  text.textContent = label(tab); if (!text.textContent) text.hidden = true;
  button.className = "tab" + (i === active ? " on" : "") + (tab.hidden ? " hidden" : ""); button.title = `${fullName(tab)}: ${stateWord(tab)} · Alt+${i + 1} · drag to reorder · right-click for rename, copy link, reload, remove`;
  if (tab.version) button.title += `\nce-workflow ${tab.version}` + (older(tab.version, newest) ? ` (behind: ${newest} runs on another hub)` : "");
  button.append(img, text);
  if (tab.version && older(tab.version, newest)) { const mark = document.createElement("small"); mark.className = "behind"; mark.textContent = "\u2191"; mark.title = `ce-workflow ${tab.version}; ${newest} is out`; button.append(mark); }
  if (!tab.url) { const small = document.createElement("small"); small.textContent = "waiting for the hub"; button.append(small); }
  button.onclick = () => select(tab.id);
  button.oncontextmenu = event => { event.preventDefault(); void menu(tab); };
  button.draggable = true;
  button.ondragstart = event => { dragged = tab; event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/plain", String(tab.id)); };

  button.ondragover = event => { event.preventDefault(); button.classList.add("drop"); };
  button.ondragleave = () => button.classList.remove("drop");
  button.ondrop = event => { event.preventDefault(); if (!dragged || dragged === tab) return; const current = tabs[active], to = tabs.indexOf(tab); tabs.splice(tabs.indexOf(dragged), 1); tabs.splice(to, 0, dragged); dragged = null; active = tabs.indexOf(current); persist(); render(); };
  return button;
 });
 const add = document.createElement("button"); add.id = "add"; add.textContent = "+"; add.title = "Add a hub: paste its link (for example another PC's tailnet address)"; add.onclick = addHub;
 const note = document.createElement("div"); note.id = "note"; note.dataset.tauriDragRegion = ""; note.textContent = notice || startupError || (staged ? "Update ready: click to restart" : "");
 if (!notice && !startupError && staged) { note.className = "update"; note.dataset.tauriDragRegion = "false"; note.title = "Restarts the app on the new version (hubs and sessions keep running)"; note.onclick = () => void invoke("restart_update"); }
 document.body.replaceChildren(...buttons, add, note, ...frameButtons());
 void updateIcons();
}
async function pixels(svg, size) {
 const img = new Image(); img.src = dataUrl(svg); await img.decode();
 const canvas = new OffscreenCanvas(size, size), g = canvas.getContext("2d"); g.drawImage(img, 0, 0, size, size);

}
// P-03/P-04: taskbar = up to 4 hubs with their dots; tray = this PC's icon with every hub's states merged.
// Overlay badge only on a pinned button (its icon is fixed): Windows draws it at 16 px over a 24 px button, which would hide
// the live icon's own dots. It shows the most urgent state and how many things need you.
async function updateIcons() {
 const all = [...new Set(tabs.flatMap(tab => tab.states))], urgent = URGENCY.find(s => all.includes(s));
 const count = tabs.reduce((sum, tab) => sum + (tab.attention || 0), 0), text = count > 9 ? "9+" : count ? String(count) : "";
 const number = text ? `<text x="8" y="12" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="${text.length > 1 ? 8.5 : 11}" fill="#fff">${text}</text>` : "";
 const local = tabs.find(tab => tab.local) ?? tabs[0];
 const key = JSON.stringify([tabs.map(t => [t.icon, t.states, fullName(t), t.url ? 1 : 0, t.attention]), staged, pinned]);
 if (key === iconKey) return; iconKey = key;
 // Hidden hubs too: hiding takes a hub off the strip, not off the taskbar icon.
 const big = ink(hubsIconSvg(tabs.map(tab => ({ icon: ICONS[tab.icon] ? tab.icon : DEFAULT_ICON, states: tab.states }))));
 const small = ink(iconSvg(ICONS[local?.icon] ? local.icon : DEFAULT_ICON, URGENCY.filter(s => all.includes(s))));
 try {
  await invoke("set_icons", { big: await pixels(big, 64), bigSize: 64, small: await pixels(small, 32), smallSize: 32, overlay: pinned && urgent ? await pixels(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="${DOT[urgent]}"/>${number}</svg>`, 16) : null });
  await invoke("set_tray", { hubs: tabs.map(tab => [tab.id, `${fullName(tab)}: ${stateWord(tab)}`]), tooltip: ["Pi Hub", ...tabs.map(tab => `${fullName(tab)}: ${stateWord(tab)}`)].join("\n") });
 } catch (error) { console.error(error); }
}
// The frameless window (config.frame): the shown hub page says where its sidebar ends (side) and the strip starts there;
// an older page sends none and the strip spans the top above it.
let stripLeft = null;
function placeStrip() {
 const side = tabs[active]?.side, left = config.frame && typeof side === "number" ? Math.max(0, Math.round(side)) : -1;
 if (left !== stripLeft) { stripLeft = left; void invoke("strip_left", { left }); }
}
function frameButtons() {
 if (!config.frame) return [];
 const win = window.__TAURI__.window.getCurrentWindow();
 const make = (text, title, action, extra = "") => { const b = document.createElement("button"); b.className = "win " + extra; b.textContent = text; b.title = title; b.onclick = action; return b; };
 const tab = tabs[active], list = [];
 if (tab && typeof tab.side === "number") {
  const gear = make("⚙", "Hub settings", () => void invoke("gear", { id: tab.id }), "gear");
  if (tab.gear) { const badge = document.createElement("b"); if (tab.gear !== "!") { badge.className = "count"; badge.textContent = tab.gear; } gear.append(badge); gear.title += " (updates)"; }
  list.push(gear);
 }
 list.push(make("─", "Minimize", () => void win.minimize()), make("☐", "Maximize / restore", () => void win.toggleMaximize()), make("✕", "Close (keeps running in the tray)", () => void win.close(), "close"));
 return list;
}
function select(id, stepping = false) {
 const index = tabs.findIndex(tab => tab.id === id); if (index < 0) return;
 active = index; if (!tabs[index].hidden) lastShown = id; void invoke("show", { id }); placeStrip(); render();
 if (!stepping) visited(tabs[index]);
}
// Back/forward mouse buttons: every session seen in the app, across hubs, like a browser's history; with Ctrl, this hub's only.
let trail = [], spot = -1;
function visited(tab) {
 if (tabs[active] !== tab || !tab.session) return;
 const here = trail[spot]; if (here && here.id === tab.id && here.session === tab.session) return;
 trail = trail.slice(0, spot + 1); trail.push({ id: tab.id, session: tab.session }); if (trail.length > 200) trail.shift(); spot = trail.length - 1;
}
function step(dir, sameHub) {
 let i = spot + dir;
 while (trail[i] && (!tabs.some(t => t.id === trail[i].id) || (sameHub && trail[i].id !== tabs[active]?.id))) i += dir;
 const to = trail[i]; if (!to) return;
 spot = i; const tab = tabs.find(t => t.id === to.id);
 select(tab.id, true); if (tab.session !== to.session) void invoke("go", { id: tab.id, session: to.session });
}
for (const type of ["mousedown", "mouseup", "auxclick"]) addEventListener(type, event => { if (event.button !== 3 && event.button !== 4) return; event.preventDefault(); if (type === "mouseup") step(event.button === 3 ? -1 : 1, event.ctrlKey); });
window.select = select;
window.shortcut = index => { if (tabs[index]) select(tabs[index].id); };
// The attention key (main.rs already brought the window up): the hub with the newest session that needs you opens that session.
window.attention = () => {
 const tab = tabs.filter(t => t.latest).sort((a, b) => b.latest - a.latest)[0]; if (!tab) return;
 select(tab.id); void invoke("attend", { id: tab.id });
};
let attentionKey = null;
// The hub page's title line (hub/web/app.ts): `pi-hub-state {"icon","name","states"}`; an older hub sends a plain title.
window.onTitle = (webview, title) => {
 const tab = tabs.find(t => "hub" + t.id === webview); if (!tab) return;
 const line = /^pi-hub-state (\{.*\})$/.exec(title ?? "");
 if (line) { try { const value = JSON.parse(line[1]); Object.assign(tab, { side: value.side, gear: value.gear ?? "", icon: value.icon || tab.icon, hubName: value.name || tab.hubName, version: value.version || "", states: Array.isArray(value.states) ? value.states : [], attention: Number(value.attention) || 0, latest: Number(value.latest) || 0 });
  // This PC's hub holds the attention key setting.
  // A newer "needs you" than this tab has shown flashes the taskbar; the first title after start only sets the mark.
  if (tab.peak !== undefined && tab.latest > tab.peak) void invoke("flash").catch(console.error);
  if (typeof value.session === "string" && value.session !== tab.session) { tab.session = value.session; visited(tab); }
  if (value.nav?.n && value.nav.n !== tab.nav) { const fresh = tab.nav !== undefined || Date.now() - value.nav.n < 2000; tab.nav = value.nav.n; if (fresh && tabs[active] === tab) step(value.nav.dir < 0 ? -1 : 1, !!value.nav.ctrl); }
  tab.peak = Math.max(tab.peak ?? 0, tab.latest);
  if (tab.local && typeof value.key === "string" && value.key !== attentionKey) { attentionKey = value.key; void invoke("attention_key", { key: value.key }).catch(error => { notice = "Attention key: " + error; render(); }); }
 } catch { /* half-written title */ } }
 else { tab.states = (title ?? "").startsWith("(!)") ? ["waiting"] : []; tab.attention = tab.states.length; }
 placeStrip(); render();
};
function open(tab) { if (tab.url) void invoke("open", { id: tab.id, url: tab.url }).then(() => { if (tabs[active] === tab) void invoke("show", { id: tab.id }); }, error => { startupError = String(error); render(); }); }
const newTab = fields => ({ id: nextId++, icon: DEFAULT_ICON, states: [], ...fields });
// prompt()/alert() draw inside this 36 px strip and get cut off, so questions are an input in the strip itself.
let asking = null, notice = "";
function ask(hint, value = "") {

  const text = document.createElement("div"), input = document.createElement("input");
  text.id = "note"; text.style.margin = "0"; text.textContent = hint;
  input.id = "ask"; input.value = value; input.title = "Enter saves · Esc cancels";
  const finish = result => { if (asking !== input) return; asking = null; done(result); render(); };
  input.onkeydown = event => { if (event.key === "Enter") finish(input.value.trim()); else if (event.key === "Escape") finish(null); };
  input.onblur = () => finish(null);
  asking = input; notice = ""; document.body.replaceChildren(text, input); input.focus(); input.select();
 });
}
async function addHub() {
 const link = await ask("Paste the hub's link (http://127.0.0.1:… or https://<pc>.<tailnet>.ts.net:…):");
 if (!link) return;
 let url; try { url = new URL(link); } catch { notice = "That is not a link."; return render(); }
 if (!["http:", "https:"].includes(url.protocol)) { notice = "Hub links start with http:// or https://."; return render(); }
 const tab = newTab({ url: url.href }); tabs.push(tab); persist(); open(tab); select(tab.id);
}
// Names are this PC's own: another PC can show or hide the same hub's name.
// A native popup menu at the cursor (the 36 px strip cannot draw a dropdown over the hub page below it).
async function menu(tab) {
 const pick = await new Promise(done => {
  const item = (text, value) => ({ text, action: () => done(value) });
  void window.__TAURI__.menu.Menu.new({ items: [
   item("Rename…", "rename"), ...(tab.name !== undefined ? [item("Reset name", "reset")] : []),
   ...(tab.url ? [item("Copy link", "copy"), item("Reload", "reload")] : []),
   ...(tab.hidden ? [item("Unhide", "hide")] : tabs.some(other => other !== tab && !other.hidden) ? [item("Hide", "hide")] : []),
   ...(tab.local ? [] : [{ item: "Separator" }, item("Remove", "remove")]),
  ] }).then(m => m.popup()).then(() => setTimeout(() => done(null), 500), error => { notice = "Menu: " + error; render(); done(null); });
 });
 if (pick === "reset") { delete tab.name; persist(); render(); }
 if (pick === "reload") open(tab);
 if (pick === "hide") { tab.hidden = !tab.hidden; persist(); render(); }
 if (pick === "copy") {
  try { await navigator.clipboard.writeText(tab.url); notice = "Link copied."; } catch { notice = tab.url; }
  render(); setTimeout(() => { if (notice === "Link copied.") { notice = ""; render(); } }, 3000);
 }
 if (pick === "rename") {
  const name = await ask("Name on this PC (empty shows only the icon):", tab.name ?? fullName(tab)); if (name === null) return;
  tab.name = name === (tab.hubName || (tab.local ? "This PC" : host(tab.url))) ? undefined : name; persist(); render();
 }
 if (pick === "remove") {
  void invoke("close", { id: tab.id }); const current = tabs[active]; tabs.splice(tabs.indexOf(tab), 1);
  notice = `Removed ${fullName(tab)}; paste its link with + to add it back.`;
  active = Math.max(0, tabs.indexOf(current)); persist(); if (tabs[active]) select(tabs[active].id); else render();
 }
}
// Hidden hubs: only shown while picked (Alt+number, tray) or after a right-click on the strip's empty part; 10 s after
// the app loses focus they go away again and a hidden hub on screen gives way to the last visible one.
let revealed = false, lastShown = null, concealTimer = 0;
document.body.addEventListener("contextmenu", event => { event.preventDefault(); if (event.target.closest("button.tab") || !tabs.some(tab => tab.hidden)) return; revealed = true; render(); });
async function conceal() {
 // A tab switch reports a blur with the app still in front (and may never report the focus back): look again later.
 if (await invoke("in_front").catch(() => false)) { concealTimer = setTimeout(conceal, 10_000); return; }

}
void window.__TAURI__.window.getCurrentWindow().onFocusChanged(({ payload: focused }) => { clearTimeout(concealTimer); if (!focused) concealTimer = setTimeout(conceal, 10_000); });
let staged = false, config = {};
config = await invoke("config");

const saved = Array.isArray(config.hubs) ? config.hubs : [];

const local = tabs.find(tab => tab.local);
const wait = setInterval(async () => {

}, 3000);
setInterval(async () => { const now = await invoke("staged"); if (now !== staged) { staged = now; iconKey = ""; render(); } }, 60_000);
// Pinning has no event; check every 10 s so the badge follows a pin or unpin.
const checkPinned = async () => { const now = await invoke("pinned"); if (now !== pinned) { pinned = now; render(); } };
void checkPinned(); setInterval(checkPinned, 10_000);
</script>
</body></html>
