# R-01 / issue #6: one version. Every pushed ce-workflow version (package.json) gets its desktop app built and published as
# release app-v<version>; the hub installs the build matching its own version (hub/src/app-install.ts, asset names there).
name: app-release
on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        # A push that does not change the version (or re-runs) finds its release already published.
        run: |
          tag="app-v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "build=no" >> "$GITHUB_OUTPUT"; else echo "build=yes" >> "$GITHUB_OUTPUT"; fi
  build:
    needs: version
    if: needs.version.outputs.build == 'yes'
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: pi-hub-app-windows-x64.exe
          - os: ubuntu-22.04
            asset: pi-hub-app-linux-x64.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: hub/app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hub/app/src-tauri
      - name: The app takes the package version
        run: |
          version="$(node -p "require('../../../package.json').version")"
          node -e "const f=require('fs'),c=JSON.parse(f.readFileSync('tauri.conf.json','utf8'));c.version=process.argv[1];f.writeFileSync('tauri.conf.json',JSON.stringify(c,null,2))" "$version"
          sed -i.bak "0,/^version = .*/s//version = \"$version\"/" Cargo.toml && rm Cargo.toml.bak
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - name: Build (Windows exe)
        if: runner.os == 'Windows'
        run: npx --yes @tauri-apps/cli@2 build --no-bundle && cp target/release/pi-hub-app.exe "$RUNNER_TEMP/${{ matrix.asset }}"
      - name: Build (Linux AppImage)
        if: runner.os == 'Linux'
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage --config '{"bundle":{"active":true}}' && cp target/release/bundle/appimage/*.AppImage "$RUNNER_TEMP/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Pi Hub app ${TAG#app-v}" --notes "Desktop app for pi-control-hub ${TAG#app-v}. The hub of the same ce-workflow version installs it from its settings (gear → Desktop app) and updates it on its own, checking each file against the SHA-256 GitHub reports."
